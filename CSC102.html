    <h2>there are 4 pillars of programming</h2>
    <!-- the script tags they specify that we are now coding with Javascript - a whole new set of rules apply in Javascript -->
    <script>
        //This is a single line Javascript comment
        
        /* this is a multi-line comment */

        // a variable stores a piece of information 
        // variables should have descriptive names

        // use descriptive variable names, such as firstName
        // let is the best way to create a Javascript variable

        let firstname = "Gustavo";
        
        // var and let are basically equivalent for the purposes of this class - but use let cause it's better
        var lastname = "Garcia Gamboa";

        
    </script>

    <h3>Functions</h3>

    <script>
        // let's talk about functions - functions are a way to organize chunks of code; functions also allow us to write code 1 
        // time and reuse it as many times as we need to

        // when creating a function in Javascript, use the keyboard function to let the interpretor know that you are creating 
        // a resuable chunk of code
        // we create a descriptive name for what our function will do; most of the time our function names should include a
        // verb; start function names with a letter, you can use numbers and _
        // camelcase or snake-case are naming styles - use whichever one you want, but stay consistent
        // after the function name, use parenthisese () whether or not you are passing values into the function
        // the function code must be placed within curly braces {}
        function addnumbers(){
            // create 2 variables so we can add them together
            let number1 = 5; // we are hard coding the value of 5 here
            let number2 = 8; 

            // create another variable to hold the sum
            let sum = number1 + number2;

            // lets write out the sum to the console
            // to concatenate (add text together), you can use + or ,
            console.log("the sum is:" + sum);
        }

        // this line of code calls the function so we can test it
        addnumbers();
    </script>

    <h3>Variables</h3>
    <h3>Decision Logic (If/Else)</h3>

    <script>
    //    when testing an if statement, make sure to use == (equality) instead of = (assignnment: this will change the value 
    // of your variable, which you probably don't want)
    // in an if chunk of code, you will have 1 and only 1 if statement, you can have as many else if as needed, and optionally, 1 else statement
    // && is and - both conditions must evaluate to true
    // || is or - only 1 condition must evaluate to true
       if(firstname == "Gustavo" || lastname == "Garcia Gamboa"){
        // since the value in firstname is Gustavo, this code will run
        console.log("Gustavo is here");
    }
    // else is the catch-all so when the if statement evaluates to false, the else will run   
    else if (firstname == "Gustavo2"){
        console.log("Gustavo2 is here");
    }
    else{
        console.log("Gustavo is not here");
    }
    </script>

    <h3>Loops</h3>

    <script>
        /* loops allow us to run code over and over again

        think of a track that you run around multiple times; mixing up cookie batter
        - keep mixing until the ingredients have combined

        for loops - we use for loops when we (us the interpretor) know how many times the loops should run

        while loops - we use while loops when we don't know how many times the loop should run: think user input
        */
        // the for loop should have 3 pieces of information
        // 1st pieceof information is a variable that keeps track of where we are in the loop
        // 2nd piece of information is the condition (that while true) the loop will continue to run
        // 3rd piece of information is changing the value of the counter variable; often we add 1:
        // i = i + 1 is the same as i++
        for (let i = 0; i < 5; i++){
            console.log("i=", i);
        }

    </script>
